name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural self-check
        run: python3 scripts/validate.py
      - name: Self-test the validator
        run: python3 scripts/validate_selftest.py

  structure-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural self-check
        run: python scripts/validate.py
      - name: Self-test the validator
        run: python scripts/validate_selftest.py
